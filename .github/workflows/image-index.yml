# __version__ = "0.1.0.2026.9.12"  # Semantic Versioning: Major.Minor.Patch.Date(YYYY.M.D)
# 0.1.0: per-folder index.json + .thumbs/ for every folder with images, rebuilt on each push
name: Build gallery index

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/index.json'
      - '!**/.thumbs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the index carries each file's last-commit date
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and tqdm
        run: pip install --quiet 'pillow>=10' 'tqdm>=4'

      - name: Build index.json and thumbnails in every image folder
        run: python tools/build_image_index.py

      - name: Commit whatever changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild gallery index'
          git push
